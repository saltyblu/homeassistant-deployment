---
apiVersion: image.toolkit.fluxcd.io/v1 #beta1
kind: ImageRepository
metadata:
  name: zigbee2mqtt
spec:
  image: koenkk/zigbee2mqtt
  interval: 4h0m
---
apiVersion: image.toolkit.fluxcd.io/v1 #beta1
kind: ImagePolicy
metadata:
  name: zigbee2mqtt
spec:
  imageRepositoryRef:
    name: zigbee2mqtt
  policy:
    semver:
      # Deliberately bumped 1.x.x -> 2.x.x by hand (2026-08-04), not by the
      # image-update bot - a major version bump needed the migration/
      # breaking-changes review documented in knowledge-base
      # services/Zigbee2MQTT.md first. Within 2.x, patch/minor bumps are
      # safe to automate again (z2m's own migration system handles those).
      range: 2.x.x
---
apiVersion: image.toolkit.fluxcd.io/v1 #beta2
kind: ImageUpdateAutomation
metadata:
  name: zigbee2mqtt
spec:
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: salty-bot@no-reply.com
        name: Salty Bot
      messageTemplate: '{{range .Changed.Changes}}{{println .}}{{end}}'
    push:
      branch: main
  interval: 24h0m
  sourceRef:
    kind: GitRepository
    name: homeassistant
    namespace: flux-system
  update:
    path: ./k8s
    strategy: Setters
