---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ha-mcp
  namespace: homeassistant
  annotations:
    kubernetes.io/ingress.class: "traefik"

spec:
  rules:
  - host: ha-mcp.fritz.box
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ha-mcp
            port:
              name: http
