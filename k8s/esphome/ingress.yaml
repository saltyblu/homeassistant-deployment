---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: esphome
  namespace: homeassistant
  annotations:
    kubernetes.io/ingress.class: "traefik"

spec:
  rules:
  - host: esphome.fritz.box
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: esphome
            port:
              name: http
