---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homeassistant-ingress
  namespace: homeassistant
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: traefik
  rules:
    - host: blu-nuc.fritz.box
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homeassistant
                port:
                  number: 8123
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homeassistant-brix-box-ingress
  namespace: homeassistant
  annotations:
    ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: homeassistant.fritz.box
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homeassistant
                port:
                  number: 8123
    - host: homeassistant.brix.box
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homeassistant
                port:
                  number: 8123
---
# Valid Let's Encrypt certificate for the Companion app. *.fritz.box can't
# get a public cert, so this salty-blu.com name gets one via DNS-01
# (Cloudflare) - no public DNS record needed. LAN/WireGuard only: internal
# websecure entrypoint, resolved by an AdGuard rewrite to blu-brix.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homeassistant-salty-blu-com
  namespace: homeassistant
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls.certresolver: "letsencrypt"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - homeassistant.salty-blu.com
  rules:
    - host: homeassistant.salty-blu.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homeassistant
                port:
                  number: 8123
...
