apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: matter
  name: matter
  namespace: homeassistant
spec:
  replicas: 1
  # hostNetwork: true means the new pod can't schedule alongside the old one
  # during a rolling update - both want the exact same host ports on this
  # single-node cluster. Recreate accepts a brief gap instead of getting
  # stuck (found via a real stuck rollout after the AppArmor field change).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matter
  template:
    metadata:
      labels:
        app: matter
    spec:
      hostNetwork: true
      volumes:
        - name: matter
          hostPath:
            path: "/data/homeassistant/matter"
            type: Directory
        - name: dbus
          hostPath:
            path: /run/dbus
      containers:
        - image: ghcr.io/home-assistant-libs/python-matter-server:6.6.1 # {"$imagepolicy": "homeassistant:matter"}
          name: matter
          volumeMounts:
            - name: matter
              mountPath: /data
            - name: dbus
              mountPath: /run/dbus
          securityContext:
            privileged: true
            appArmorProfile:
              type: Unconfined
          ports:
            - containerPort: 5530
